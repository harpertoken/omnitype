repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|cc|cxx|cpp|java|js|ts)$
        types: [file]

  - repo: local
     hooks:
       - id: cargo-check
         name: cargo check
         entry: cargo check
         language: system
         pass_filenames: false
         files: \.(rs|toml)$

       - id: cargo-clippy
         name: cargo clippy
         entry: cargo clippy --all-targets --all-features
         language: system
         pass_filenames: false
         files: \.(rs|toml)$

       - id: cargo-fmt
         name: cargo fmt
         entry: cargo fmt --all -- --check
         language: system
         pass_filenames: false
         files: \.(rs|toml)$

       - id: cargo-test
         name: cargo test
         entry: cargo test
         language: system
         pass_filenames: false
         files: \.(rs|toml)$
